<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Minimal fontconfig for headless Chrome in this sandbox.

  WHY THIS EXISTS
  This container has no /etc/fonts and no system font packages. Chrome's Skia
  then fails to resolve *any* font family and aborts the renderer:

      FATAL:third_party/skia/src/ports/SkFontMgr_FontConfigInterface.cpp:163]
      Not implemented.
      Received signal 6

  which surfaces to Puppeteer as "Navigating frame was detached". It shows up on
  whichever page asks for the most fallback faces, which is why the home route
  appeared to be the broken one.

  The <dir> below is the truetype tree unpacked from the .deb cache described in
  README → "Verifying the layout". That path is environment setup, not part of
  the app: the site ships its own webfonts from /public/fonts and never depends
  on a system font.
-->
<fontconfig>
  <dir>/tmp/chromelibs/usr/share/fonts</dir>
  <cachedir>/tmp/fontcache</cachedir>

  <match target="pattern">
    <test qual="any" name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>DejaVu Sans</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>DejaVu Serif</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>DejaVu Sans Mono</string></edit>
  </match>
</fontconfig>
